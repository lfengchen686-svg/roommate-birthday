<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>付津隆 · 20岁生日快乐</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 35%),
        linear-gradient(145deg,#10162f,#251b47 55%,#512c5f);
    color:white;
    touch-action:manipulation;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    min-height:100svh;
}

/* 星空 */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2.2s infinite alternate;
    opacity:.5;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.7)}
    to{opacity:1;transform:scale(1.4)}
}

/* 页面 */
.scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 24px 90px;
    text-align:center;
    opacity:0;
    transform:translateY(35px) scale(.97);
    pointer-events:none;
    transition:
        opacity .85s ease,
        transform .85s cubic-bezier(.2,.8,.2,1);
}

.scene.active{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.big{
    font-size:clamp(38px,10vw,72px);
    font-weight:800;
    line-height:1.2;
    letter-spacing:2px;
    text-shadow:0 5px 30px rgba(255,120,180,.35);
}

.medium{
    margin-top:20px;
    font-size:clamp(21px,5vw,34px);
    line-height:1.8;
}

.small{
    margin-top:20px;
    font-size:15px;
    opacity:.7;
    line-height:1.8;
}

.gradient-text{
    background:linear-gradient(90deg,#ffd166,#ff8fab,#9bf6ff);
    -webkit-background-clip:text;
    color:transparent;
}

.start-btn{
    margin-top:40px;
    padding:16px 34px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:999px;
    background:rgba(255,255,255,.13);
    backdrop-filter:blur(14px);
    color:white;
    font-size:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    animation:pulse 1.7s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

/* 照片 */
.photo-wrap{
    width:min(78vw,390px);
    padding:9px 9px 35px;
    background:#fff;
    border-radius:7px;
    box-shadow:0 22px 60px rgba(0,0,0,.38);
    transform:rotate(-2deg);
    margin-bottom:24px;
}

.photo-wrap img{
    width:100%;
    max-height:55vh;
    display:block;
    object-fit:cover;
    border-radius:3px;
}

.photo-caption{
    color:#333;
    font-size:15px;
    margin-top:11px;
    font-weight:600;
}

/* 蛋糕 */
.cake{
    font-size:100px;
    animation:float 2.3s ease-in-out infinite;
    filter:drop-shadow(0 15px 20px rgba(0,0,0,.25));
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

/* 小标签 */
.badge{
    display:inline-block;
    margin-bottom:18px;
    padding:8px 17px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    font-size:14px;
}

/* 底部提示 */
#tapHint{
    position:absolute;
    bottom:26px;
    left:0;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,.55);
    font-size:13px;
    letter-spacing:2px;
    z-index:20;
    animation:hint 1.7s infinite;
}

@keyframes hint{
    0%,100%{opacity:.35}
    50%{opacity:1}
}

/* 进度点 */
#dots{
    position:absolute;
    bottom:52px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:7px;
    z-index:20;
}

.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    transition:.3s;
}

.dot.active{
    width:18px;
    border-radius:10px;
    background:white;
}

/* 彩纸画布 */
#confetti{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:15;
}

/* 最后一幕按钮 */
.replay{
    margin-top:30px;
    padding:12px 25px;
    border:none;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:15px;
    border:1px solid rgba(255,255,255,.25);
}

.heart{
    font-size:70px;
    margin-bottom:20px;
    animation:heartbeat 1.2s infinite;
}

@keyframes heartbeat{
    0%,100%{transform:scale(1)}
    25%{transform:scale(1.12)}
    40%{transform:scale(1)}
    60%{transform:scale(1.1)}
}
</style>
</head>

<body>

<div id="app">

<canvas id="confetti"></canvas>

<!-- 第一幕 -->
<section class="scene active">
    <div class="badge">🎁 一份来自室友的神秘礼物</div>

    <div class="big gradient-text">
        给付津隆的<br>20岁生日惊喜
    </div>

    <div class="small">
        今天这个页面<br>
        只属于你
    </div>

    <button class="start-btn" id="startBtn">
        点一下开启 ✨
    </button>
</section>

<!-- 第二幕 -->
<section class="scene">
    <div class="small">2006 → 2026</div>

    <div class="big gradient-text">
        20岁<br>生日快乐
    </div>

    <div class="medium">
        🎂 🎉 🎈
    </div>
</section>

<!-- 第三幕 -->
<section class="scene">
    <div class="badge">今日寿星</div>

    <div class="big">
        小学生<br>
        <span class="gradient-text">付津隆</span>
    </div>

    <div class="medium">
        居然已经20岁了
    </div>

    <div class="small">
        虽然年龄已经两位数开头是2了<br>
        但小学鸡属性依然稳定发挥
    </div>
</section>

<!-- 第四幕：照片 -->
<section class="scene">
    <div class="photo-wrap">
        <img src="photo.jpg" alt="付津隆">
        <div class="photo-caption">
            📸 20岁的付津隆
        </div>
    </div>

    <div class="medium">
        愿你一直有少年感<br>
        也越来越有自己的方向
    </div>
</section>

<!-- 第五幕 -->
<section class="scene">
    <div class="cake">🎂</div>

    <div class="big gradient-text">
        二十岁
    </div>

    <div class="medium">
        是新的存档点
    </div>

    <div class="small">
        愿新的一岁<br>
        有好成绩 · 有好心情<br>
        有钱花 · 有觉睡 · 有人陪<br>
        还有永远打不完的快乐
    </div>
</section>

<!-- 第六幕 -->
<section class="scene">
    <div class="heart">❤️</div>

    <div class="big gradient-text">
        生日快乐<br>
        付津隆
    </div>

    <div class="medium">
        20岁，继续做你自己。
    </div>

    <div class="small">
        新的一岁，一切都值得期待。<br><br>
        —— 你的室友
    </div>

    <button class="replay" id="replayBtn">
        再看一次 ↻
    </button>
</section>

<div id="dots"></div>
<div id="tapHint" style="display:none;">点击屏幕 · 继续</div>

</div>

<script>
const scenes = document.querySelectorAll(".scene");
const startBtn = document.getElementById("startBtn");
const replayBtn = document.getElementById("replayBtn");
const tapHint = document.getElementById("tapHint");
const dotsBox = document.getElementById("dots");

let current = 0;
let started = false;
let locked = false;

/* 创建星星 */
for(let i=0;i<45;i++){
    const s=document.createElement("span");
    s.className="star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.animationDelay=Math.random()*2+"s";
    s.style.animationDuration=(1.4+Math.random()*2)+"s";
    document.getElementById("app").appendChild(s);
}

/* 进度点 */
scenes.forEach((_,i)=>{
    const d=document.createElement("span");
    d.className="dot"+(i===0?" active":"");
    dotsBox.appendChild(d);
});

function updateDots(){
    document.querySelectorAll(".dot").forEach((d,i)=>{
        d.classList.toggle("active",i===current);
    });
}

function showScene(index){
    scenes[current].classList.remove("active");
    current=index;
    scenes[current].classList.add("active");
    updateDots();

    if(current===1 || current===4 || current===5){
        burstConfetti(current===5 ? 180 : 100);
    }

    tapHint.style.display =
        current>0 && current<scenes.length-1 ? "block":"none";
}

/* 点击推进 */
document.getElementById("app").addEventListener("click",(e)=>{
    if(!started) return;

    if(
        e.target===startBtn ||
        e.target===replayBtn
    ) return;

    if(locked) return;

    if(current < scenes.length-1){
        locked=true;
        showScene(current+1);
        setTimeout(()=>locked=false,700);
    }
});

/* -------------------------
   音乐：Web Audio API
   无需上传 mp3
------------------------- */

let audioCtx;
let musicTimer;
let noteIndex=0;

/* 原创轻快生日氛围旋律 */
const melody=[
    392,440,494,587,
    494,440,392,330,
    392,494,587,659,
    587,494,440,392,
    330,392,440,494,
    392,330,294,330
];

function playNote(freq){
    if(!audioCtx) return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(0,audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(.07,audioCtx.currentTime+.03);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.32);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+.34);
}

function startMusic(){
    try{
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();

        playNote(melody[0]);

        musicTimer=setInterval(()=>{
            noteIndex=(noteIndex+1)%melody.length;
            playNote(melody[noteIndex]);
        },390);

    }catch(e){
        console.log("Audio unavailable");
    }
}

startBtn.addEventListener("click",(e)=>{
    e.stopPropagation();

    started=true;
    startMusic();
    showScene(1);
});

replayBtn.addEventListener("click",(e)=>{
    e.stopPropagation();

    showScene(0);
    started=false;

    tapHint.style.display="none";

    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer=null;
    }

    if(audioCtx){
        audioCtx.close();
        audioCtx=null;
    }

    noteIndex=0;
});

/* -------------------------
   彩纸动画
------------------------- */

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

let particles=[];

function resize(){
    canvas.width=window.innerWidth*devicePixelRatio;
    canvas.height=window.innerHeight*devicePixelRatio;

    canvas.style.width=window.innerWidth+"px";
    canvas.style.height=window.innerHeight+"px";

    ctx.setTransform(
        devicePixelRatio,0,
        0,devicePixelRatio,
        0,0
    );
}

resize();
window.addEventListener("resize",resize);

function burstConfetti(count=100){
    const colors=[
        "#ff6b9d",
        "#ffd166",
        "#70d6ff",
        "#c77dff",
        "#80ffdb",
        "#ffffff"
    ];

    for(let i=0;i<count;i++){
        particles.push({
            x:window.innerWidth/2,
            y:window.innerHeight*.25,
            vx:(Math.random()-.5)*9,
            vy:-Math.random()*7-2,
            gravity:.12+Math.random()*.08,
            size:5+Math.random()*5,
            rot:Math.random()*Math.PI,
            vr:(Math.random()-.5)*.2,
            color:colors[
                Math.floor(Math.random()*colors.length)
            ],
            life:160+Math.random()*80
        });
    }
}

function animate(){
    ctx.clearRect(
        0,0,
        window.innerWidth,
        window.innerHeight
    );

    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.gravity;
        p.rot+=p.vr;
        p.life--;

        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle=p.color;
        ctx.fillRect(
            -p.size/2,
            -p.size/2,
            p.size,
            p.size*.65
        );
        ctx.restore();
    });

    particles=particles.filter(p=>p.life>0);

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
